<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 助农服务平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .cart-item {
            transition: all 0.3s ease;
        }
        .cart-item:hover {
            background-color: #f8f9fa;
        }
        .quantity-btn {
            width: 35px;
            height: 35px;
        }
        .empty-cart {
            padding: 80px 0;
        }
        .cart-summary {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">🌱 助农服务平台</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">首页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/product/list">农产品商城</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/cart">购物车</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">登录</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/register">注册</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- 页面标题 -->
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="text-center">🛒 我的购物车</h2>
            <p class="text-center text-muted">管理您的购物商品</p>
        </div>
    </div>

    <!-- 购物车内容 -->
    <div th:if="${cartItems.empty}">
        <div class="empty-cart text-center">
            <div class="mb-4">
                <span style="font-size: 4rem;">🛒</span>
            </div>
            <h4 class="text-muted mb-3">购物车空空如也</h4>
            <p class="text-muted mb-4">快去挑选一些心仪的商品吧！</p>
            <a href="/product/list" class="btn btn-success btn-lg">
                🛍️ 去购物
            </a>
        </div>
    </div>

    <!-- 购物车商品列表 -->
    <div th:unless="${cartItems.empty}">
        <div class="card">
            <div class="card-header bg-light">
                <div class="row">
                    <div class="col-md-5">
                        <h5 class="mb-0">商品信息</h5>
                    </div>
                    <div class="col-md-2 text-center">
                        <h5 class="mb-0">单价</h5>
                    </div>
                    <div class="col-md-2 text-center">
                        <h5 class="mb-0">数量</h5>
                    </div>
                    <div class="col-md-1 text-center">
                        <h5 class="mb-0">小计</h5>
                    </div>
                    <div class="col-md-2 text-center">
                        <h5 class="mb-0">操作</h5>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <!-- 购物车商品项 -->
                <div th:each="cartItem : ${cartItems}" class="row align-items-center mb-4 pb-3 border-bottom cart-item">
                    <div class="col-md-5 d-flex align-items-center">
                        <div class="rounded overflow-hidden d-flex align-items-center justify-content-center bg-light"
                             style="height: 100px; width: 100px;">
                            <img th:if="${#strings.isNotEmpty(cartItem.mainImage)}"
                                 th:src="@{${cartItem.mainImage}}"
                                 th:alt="${cartItem.productName}"
                                 class="img-fluid h-100 w-100"
                                 style="object-fit: cover;">
                            <span th:unless="${#strings.isNotEmpty(cartItem.mainImage)}" class="text-muted">暂无图片</span>
                        </div>
                        <div class="ms-3">
                            <h6 class="mb-2" th:text="${cartItem.productName}">商品名称</h6>
                            <p class="text-muted mb-1 small" th:text="${cartItem.description}">商品描述信息待完善</p>
                            <div class="mt-2">
                                <span class="badge bg-secondary me-1" th:text="'ID:' + ${cartItem.productId}"></span>
                                <span class="badge bg-info"
                                      th:text="${cartItem.stockQuantity} != null ? '库存 ' + cartItem.stockQuantity + ' ' + cartItem.unit : '库存充足'"></span>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-2 text-center">
                        <span class="fw-bold text-success" style="font-size: 1.2rem;"
                              th:text="'¥' + ${cartItem.price}">¥0.00</span>
                        <br>
                        <small class="text-muted" th:text="${cartItem.unit != '' ? '单位：' + cartItem.unit : ''}"></small>
                    </div>

                    <div class="col-md-2">
                        <div class="d-flex align-items-center justify-content-center">
                            <button class="btn btn-outline-secondary quantity-btn"
                                    th:onclick="|updateQuantity(${cartItem.cartItemId}, ${cartItem.quantity - 1}, ${cartItem.stockQuantity == null ? -1 : cartItem.stockQuantity})|"
                                    th:disabled="${cartItem.quantity <= 1}">-</button>

                            <input type="text" class="form-control text-center mx-2"
                                   style="width: 60px;"
                                   th:value="${cartItem.quantity}"
                                   readonly>

                            <button class="btn btn-outline-secondary quantity-btn"
                                    th:onclick="|updateQuantity(${cartItem.cartItemId}, ${cartItem.quantity + 1}, ${cartItem.stockQuantity == null ? -1 : cartItem.stockQuantity})|"
                                    th:disabled="${cartItem.stockQuantity != null ? cartItem.quantity >= cartItem.stockQuantity : false}">+</button>
                        </div>
                    </div>

                    <div class="col-md-1 text-center">
                        <span class="fw-bold" th:text="'¥' + ${cartItem.subtotal}">¥0.00</span>
                    </div>

                    <div class="col-md-2 text-center">
                        <button class="btn btn-outline-danger btn-sm"
                                th:onclick="|removeFromCart(${cartItem.cartItemId})|">
                            🗑️ 删除
                        </button>
                    </div>
                </div>

                <!-- 购物车统计 -->
                <div class="row mt-4">
                    <div class="col-md-8">
                        <div class="d-flex align-items-center flex-wrap">
                                <span class="text-muted">
                                    共 <span class="fw-bold" th:text="${totalQuantity}">0</span> 件商品
                                    <span class="text-muted ms-2">（<span th:text="${cartItems.size()}">0</span> 种）</span>
                                </span>
                            <button class="btn btn-outline-warning btn-sm ms-3 mt-2 mt-md-0"
                                    onclick="clearCart()">
                                🧹 清空购物车
                            </button>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="cart-summary p-3 rounded">
                            <div class="row mb-2">
                                <div class="col-6">
                                    <span>商品总数:</span>
                                </div>
                                <div class="col-6 text-end">
                                    <span th:text="${totalQuantity}">0</span> 件
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <span>合计金额:</span>
                                </div>
                                <div class="col-6 text-end">
                                        <span class="fw-bold" style="font-size: 1.3rem;"
                                              th:text="'¥' + ${totalAmount}">¥0.00</span>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-light btn-lg fw-bold" onclick="checkout()">
                                    💰 去结算
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 继续购物提示 -->
        <div class="text-center mt-4">
            <a href="/product/list" class="btn btn-outline-success">
                ← 继续购物
            </a>
        </div>
    </div>
</div>

<!-- 页脚 -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 助农服务平台. 保留所有权利.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 更新商品数量
    function updateQuantity(cartItemId, newQuantity, maxQuantity) {
        if (newQuantity < 1) {
            alert('数量不能小于1');
            return;
        }

        const max = Number(maxQuantity);
        const unlimited = Number.isNaN(max) || !Number.isFinite(max) || max < 0;
        if (!unlimited && max === 0 && newQuantity > max) {
            alert('该商品暂时无库存，无法增加数量');
            return;
        }

        if (!unlimited && max > 0 && newQuantity > max) {
            alert('超过库存上限，当前库存为 ' + max + ' 件');
            return;
        }

        const params = new URLSearchParams();
        params.append('cartItemId', cartItemId);
        params.append('quantity', newQuantity);

        fetch('/cart/update', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: params.toString()
        }).then(response => {
            if (!response.ok) {
                throw new Error('网络响应不正常');
            }
            return response.text();
        }).then(result => {
            if (result.startsWith('success')) {
                location.reload();
            } else {
                const message = result.startsWith('error') ? result.substring(6).trim() : '更新失败，请重试';
                alert(message || '更新失败，请重试');
            }
        }).catch(error => {
            console.error('更新数量错误:', error);
            alert('更新失败: ' + error.message);
        });
    }

    // 删除商品
    function removeFromCart(cartItemId) {
        if (!confirm('确定要删除这个商品吗？')) {
            return;
        }

        const params = new URLSearchParams();
        params.append('cartItemId', cartItemId);

        fetch('/cart/remove', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: params.toString()
        }).then(response => {
            if (!response.ok) {
                throw new Error('网络响应不正常');
            }
            return response.text();
        }).then(result => {
            if (result.startsWith('success')) {
                location.reload();
            } else {
                const message = result.startsWith('error') ? result.substring(6).trim() : '删除失败，请重试';
                alert(message || '删除失败，请重试');
            }
        }).catch(error => {
            console.error('删除商品错误:', error);
            alert('删除失败: ' + error.message);
        });
    }

    // 清空购物车
    function clearCart() {
        if (!confirm('确定要清空整个购物车吗？此操作不可撤销！')) {
            return;
        }

        console.log('清空购物车');

        fetch('/cart/clear', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('网络响应不正常');
            }
            return response.text();
        }).then(result => {
            if (result.startsWith('success')) {
                console.log('清空成功');
                location.reload();
            } else {
                const message = result.startsWith('error') ? result.substring(6).trim() : '清空失败，请重试';
                alert(message || '清空失败，请重试');
            }
        }).catch(error => {
            console.error('清空购物车错误:', error);
            alert('清空失败: ' + error.message);
        });
    }

    // 结算功能
    function checkout() {
        fetch('/cart/checkout', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            }
        }).then(response => {
            if (!response.ok) {
                throw new Error('网络响应不正常');
            }
            return response.text();
        }).then(result => {
            if (result.startsWith('success')) {
                alert('结算成功，库存已更新！');
                location.reload();
            } else {
                const message = result.startsWith('error') ? result.substring(6).trim() : '结算失败，请重试';
                alert(message || '结算失败，请重试');
            }
        }).catch(error => {
            console.error('结算错误:', error);
            alert('结算失败: ' + error.message);
        });
    }

    // 页面加载完成后的初始化
    document.addEventListener('DOMContentLoaded', function() {
        console.log('购物车页面加载完成');
    });
</script>
</body>
</html>
