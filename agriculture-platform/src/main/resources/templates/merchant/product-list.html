<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农产品管理 - 商家工作台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .status-badge {
            font-size: 0.85rem;
        }
        .table thead {
            background-color: #f1f3f5;
        }
        .action-buttons form {
            display: inline;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">🌱 助农服务平台</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#merchantNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="merchantNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/product/list">农产品商城</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">购物车</a></li>
                <li class="nav-item"><a class="nav-link" href="/merchant/dashboard">商家中心</a></li>
                <li class="nav-item"><a class="nav-link active" href="/merchant/products">农产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">退出</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="page-header mb-3">
        <div>
            <h2 class="mb-1">农产品管理</h2>
            <p class="text-muted mb-0">添加、编辑或下架您的农产品，随时维护商品信息。</p>
        </div>
        <a class="btn btn-success" href="/merchant/products/new">+ 新增农产品</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">商品名称</th>
                        <th scope="col">价格</th>
                        <th scope="col">库存</th>
                        <th scope="col">状态</th>
                        <th scope="col">更新时间</th>
                        <th scope="col" class="text-end">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.productId}">1</td>
                        <td th:text="${product.productName}">示例农产品</td>
                        <td th:text="${product.price != null ? '¥' + product.price : '—'}">¥0.00</td>
                        <td th:text="${product.stockQuantity != null ? product.stockQuantity : 0}">0</td>
                        <td>
                            <span class="badge status-badge"
                                  th:classappend="${#strings.equalsIgnoreCase(product.status, 'ACTIVE')} ? ' bg-success' : (${#strings.equalsIgnoreCase(product.status, 'INACTIVE')} ? ' bg-secondary' : ' bg-warning text-dark')"
                                  th:text="${product.status != null ? product.status : 'UNKNOWN'}">
                                ACTIVE
                            </span>
                        </td>
                        <td th:text="${product.updateTime != null ? #temporals.format(product.updateTime, 'yyyy-MM-dd HH:mm') : '--'}">--</td>
                        <td class="text-end action-buttons">
                            <a class="btn btn-outline-primary btn-sm me-2"
                               th:href="@{'/merchant/products/' + ${product.productId} + '/edit'}">编辑</a>
                            <form th:action="@{'/merchant/products/' + ${product.productId} + '/deactivate'}" method="post"
                                  th:if="${product.status == null || #strings.equalsIgnoreCase(product.status, 'ACTIVE')}"
                                  onsubmit="return confirm('确认下架该农产品吗？');">
                                <button type="submit" class="btn btn-outline-danger btn-sm">下架</button>
                            </form>
                            <span th:if="${product.status != null && !#strings.equalsIgnoreCase(product.status, 'ACTIVE')}"
                                  class="text-muted">已下架</span>
                        </td>
                    </tr>
                    <tr th:if="${products == null || products.isEmpty()}">
                        <td colspan="7" class="text-center py-4 text-muted">暂无农产品，请点击右上角“新增农产品”添加。</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 助农服务平台. 保留所有权利.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
