<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : '商家中心'}">商家工作台 - 助农服务平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .hero-card {
            background: linear-gradient(135deg, #198754, #20c997);
            color: #fff;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px rgba(25, 135, 84, 0.2);
        }
        .action-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }
        .action-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 24px rgba(0, 0, 0, 0.12);
        }
        .action-card .card-title {
            font-weight: 600;
            color: #198754;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">🌱 助农服务平台</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#merchantNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="merchantNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/product/list">农产品商城</a></li>
                <li class="nav-item"><a class="nav-link" href="/cart">购物车</a></li>
                <li class="nav-item"><a class="nav-link active" href="/merchant/dashboard">商家中心</a></li>
                <li class="nav-item"><a class="nav-link" href="/merchant/products">农产品管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout" th:href="@{/logout}">退出</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="hero-card mb-4">
        <h1 class="fw-bold mb-3">欢迎回到商家工作台</h1>
        <p class="mb-0">在这里管理您的农产品、订单和销售数据，持续为消费者提供优质的农产品服务。</p>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card action-card">
                <div class="card-body">
                    <h5 class="card-title">商品管理</h5>
                    <p class="card-text text-muted">添加、编辑或下架您的农产品，随时维护商品信息。</p>
                    <a href="/merchant/products" class="btn btn-success">进入管理</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card action-card">
                <div class="card-body">
                    <h5 class="card-title">订单概览</h5>
                    <p class="card-text text-muted">查看最新订单状态，安排发货并跟踪配送情况。</p>
                    <a href="#" class="btn btn-outline-success disabled">开发中</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card action-card">
                <div class="card-body">
                    <h5 class="card-title">销售分析</h5>
                    <p class="card-text text-muted">掌握销售趋势与热销商品，制定高效营销策略。</p>
                    <a href="#" class="btn btn-outline-success disabled">开发中</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 助农服务平台. 保留所有权利.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
