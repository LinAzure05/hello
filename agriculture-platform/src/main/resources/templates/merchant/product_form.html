<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle}">农产品表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .form-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 2rem;
        }
        .form-section-title {
            font-weight: 600;
            margin-bottom: 1rem;
            color: #198754;
        }
        .btn-back {
            color: #198754;
        }
        .btn-back:hover {
            color: #0f5132;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🌱 助农服务平台</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#merchantNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="merchantNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">首页</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">农产品商城</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">购物车</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/merchant/dashboard}">商家中心</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/merchant/products}">农产品管理</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">退出</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <a th:href="@{/merchant/products}" class="btn btn-link btn-back">← 返回列表</a>
            <h2 class="mt-2 mb-0" th:text="${formTitle}">农产品表单</h2>
            <p class="text-muted mb-0">完善商品信息，确保用户能够快速了解您的农产品。</p>
        </div>
    </div>

    <div class="form-card">
        <form th:action="${isEdit} ? @{/merchant/products/{id}(id=${product.productId})} : @{/merchant/products}"
              th:object="${product}" method="post">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">商品名称<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{productName}" placeholder="请输入商品名称" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">价格 (元)<span class="text-danger">*</span></label>
                    <input type="number" class="form-control" th:field="*{price}" min="0" step="0.01" placeholder="0.00" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">库存数量<span class="text-danger">*</span></label>
                    <input type="number" class="form-control" th:field="*{stockQuantity}" min="0" step="1" placeholder="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">单位</label>
                    <input type="text" class="form-control" th:field="*{unit}" placeholder="例如：斤、箱">
                </div>
                <div class="col-md-6">
                    <label class="form-label">主图地址</label>
                    <input type="text" class="form-control" th:field="*{mainImage}" placeholder="请输入商品主图的完整URL">
                </div>
                <div class="col-md-6">
                    <label class="form-label">标签</label>
                    <input type="text" class="form-control" th:field="*{tags}" placeholder="例如：有机, 新鲜">
                </div>
                <div class="col-md-3">
                    <label class="form-label">是否推荐</label>
                    <div class="form-check form-switch mt-1">
                        <input class="form-check-input" type="checkbox" th:field="*{isFeatured}">
                        <label class="form-check-label">在首页展示为推荐商品</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">商品状态</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">商品描述</label>
                    <textarea class="form-control" th:field="*{description}" rows="5"
                              placeholder="介绍商品的产地、特色和优势，吸引消费者购买"></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-end mt-4">
                <a th:href="@{/merchant/products}" class="btn btn-outline-secondary me-2">取消</a>
                <button type="submit" class="btn btn-success" th:text="${isEdit} ? '保存修改' : '创建商品'"></button>
            </div>
        </form>
    </div>
</div>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 助农服务平台. 保留所有权利.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
