<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.productName} + ' - 商品详情'">商品详情 - 助农服务平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .product-detail {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        .product-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }
        .product-info {
            padding: 2rem;
        }
        .product-title {
            color: #333;
            margin-bottom: 1rem;
        }
        .product-price {
            color: #28a745;
            font-size: 2rem;
            font-weight: bold;
        }
        .product-unit {
            color: #6c757d;
            font-size: 1.2rem;
        }
        .product-stock {
            color: #6c757d;
            font-size: 1rem;
        }
        .product-description {
            line-height: 1.6;
            color: #555;
        }
        .quantity-control {
            width: 120px;
        }
        .btn-add-cart {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
            padding: 10px 30px;
            font-weight: 500;
        }
        .btn-add-cart:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
        .btn-buy-now {
            background-color: #fd7e14;
            border-color: #fd7e14;
            color: white;
            padding: 10px 30px;
            font-weight: 500;
        }
        .btn-buy-now:hover {
            background-color: #e96a10;
            border-color: #dc650e;
        }
        .back-link {
            color: #28a745;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<!-- 修复后的导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">🌱 助农服务平台</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">首页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/product/list">农产品商城</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/login">登录</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/register">注册</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 面包屑导航 -->
<div class="container mt-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/" class="back-link">首页</a></li>
            <li class="breadcrumb-item"><a href="/product/list" class="back-link">农产品商城</a></li>
            <li class="breadcrumb-item active" th:text="${product.productName}">商品详情</li>
        </ol>
    </nav>
</div>

<!-- 商品详情内容 -->
<div class="container my-4">
    <div class="row product-detail">
        <!-- 商品图片 -->
        <div class="col-md-6 p-4">
            <div th:if="${product.mainImage}">
                <img th:src="@{${product.mainImage}}"
                     class="product-image"
                     th:alt="${product.productName}">
            </div>
            <div th:unless="${product.mainImage}"
                 class="product-image d-flex align-items-center justify-content-center bg-light">
                <span class="text-muted">暂无图片</span>
            </div>
        </div>

        <!-- 商品信息 -->
        <div class="col-md-6 p-4">
            <div class="product-info">
                <h1 class="product-title" th:text="${product.productName}">商品名称</h1>

                <div class="mb-3">
                    <span class="product-price" th:text="'¥' + ${product.price}">¥0.00</span>
                    <span class="product-unit" th:text="'/' + ${product.unit}">/单位</span>
                </div>

                <div class="mb-3">
                    <span class="product-stock" th:text="'库存: ' + ${product.stockQuantity} + ' ' + ${product.unit}">库存: 0</span>
                </div>

                <div class="mb-4">
                    <p class="product-description" th:text="${product.description}">商品描述信息</p>
                </div>

                <!-- 购买操作 -->
                <div class="mb-4">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <label for="quantity" class="form-label">数量:</label>
                        </div>
                        <div class="col-auto">
                            <div class="input-group quantity-control">
                                <button class="btn btn-outline-secondary" type="button" onclick="decreaseQuantity()">-</button>
                                <input type="number" class="form-control text-center" id="quantity" value="1" min="1" th:max="${product.stockQuantity}">
                                <button class="btn btn-outline-secondary" type="button" onclick="increaseQuantity()">+</button>
                            </div>
                        </div>
                        <div class="col-auto">
                            <span class="text-muted" th:text="'最多可购买 ' + ${product.stockQuantity} + ' ' + ${product.unit}">最多可购买 0</span>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="d-grid gap-2 d-md-flex">
                    <button class="btn btn-add-cart flex-fill me-md-2" onclick="addToCart()">
                        🛒 加入购物车
                    </button>
                    <button class="btn btn-buy-now flex-fill" onclick="buyNow()">
                        🚀 立即购买
                    </button>
                </div>

                <!-- 商品标签 -->
                <div class="mt-4" th:if="${product.tags}">
                    <h6>商品标签:</h6>
                    <div>
                            <span th:each="tag : ${#strings.arraySplit(product.tags, ',')}"
                                  class="badge bg-light text-dark me-1" th:text="${tag}">标签</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 商品详情扩展区域（可以后续添加评价、推荐等） -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="product-detail p-4">
                <h4>商品详情</h4>
                <div class="mt-3">
                    <p th:text="${product.description}">这里是商品的详细描述信息，包括产地、种植方式、营养价值等。</p>
                    <p class="text-muted">更多详细信息正在完善中...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 页脚 -->
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">&copy; 2024 助农服务平台. 保留所有权利.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 数量控制函数
    function decreaseQuantity() {
        const quantityInput = document.getElementById('quantity');
        let quantity = parseInt(quantityInput.value);
        if (quantity > 1) {
            quantityInput.value = quantity - 1;
        }
    }

    function increaseQuantity() {
        const quantityInput = document.getElementById('quantity');
        const maxStock = parseInt(quantityInput.getAttribute('max'));
        let quantity = parseInt(quantityInput.value);
        if (quantity < maxStock) {
            quantityInput.value = quantity + 1;
        }
    }

    // 购买操作函数
    function addToCart() {
        const quantity = document.getElementById('quantity').value;
        const productId = [[${product.productId}]];

        fetch('/cart/add?productId=' + productId + '&quantity=' + quantity, {
            method: 'POST'
        }).then(response => response.text())
            .then(result => {
                if (result === 'success') {
                    alert('已成功加入购物车！');
                } else {
                    alert('加入购物车失败');
                }
            });
    }

    function buyNow() {
        const quantity = document.getElementById('quantity').value;
        const productId = [[${product.productId}]];
        alert('立即购买！商品ID: ' + productId + ', 数量: ' + quantity);
        // 这里可以跳转到订单页面
    }

    // 输入验证
    document.getElementById('quantity').addEventListener('change', function() {
        let quantity = parseInt(this.value);
        const maxStock = parseInt(this.getAttribute('max'));
        const minStock = parseInt(this.getAttribute('min'));

        if (quantity < minStock) {
            this.value = minStock;
        } else if (quantity > maxStock) {
            this.value = maxStock;
        }
    });
</script>
</body>
</html>
